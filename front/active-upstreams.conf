# ACTIVE BLUE-GREEN COLOR: blue (seeded default).
# This file is THE switch: scripts/deploy-nas.sh --color <c> rewrites it for
# the new color and applies it with `nginx -s reload` inside the running
# roboco-nginx container. Included from deploy/nginx.conf. Upstream names
# must match the color-suffixed containers in docker-compose.yaml.

upstream roboco_panel {
    server roboco-panel-blue:3000;
}

upstream roboco_orchestrator {
    server roboco-orchestrator-blue:8000;
}

upstream roboco_dispatcher {
    server roboco-dispatcher-blue:8000;
}
